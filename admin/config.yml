backend:
  name: git-gateway
  branch: main

site_url: https://homahof-design-2026-website.netlify.app

media_folder: images
public_folder: /images

collections:
  - name: veranstaltungen
    label: Veranstaltungen
    files:
      - name: veranstaltungen
        label: Veranstaltungen
        file: content/veranstaltungen.json
        format: json
        fields:
          - label: Veranstaltungen
            name: items
            widget: list
            fields:
              - { label: Titel,        name: title,    widget: string }
              - { label: Datum,        name: date,     widget: datetime, format: "YYYY-MM-DD" }
              - { label: Zeit,         name: time,     widget: string,   hint: "z.B. 09:00 – 17:00" }
              - { label: Ort,          name: location, widget: string,   default: "Homa-Hof Heiligenberg" }
              - { label: Beschreibung, name: desc,     widget: text }
              - { label: Beitrag,      name: price,    widget: string,   hint: "z.B. Kostenlos / Spende" }
              - { label: Kategorie,    name: category, widget: select,   options: [Seminar, Sommertreffen, Abend, Retreat, Workshop] }
              - { label: Badge-Farbe,  name: badge,    widget: select,   options: [kostenlos, spende, kostenpflichtig], default: kostenlos }
              - { label: Detailtext,   name: detail,   widget: text,     required: false, hint: "Optionaler Langtext im aufgeklappten Bereich" }
              - { label: Bild,         name: image,    widget: image,    required: false, hint: "Optionales Bild im aufgeklappten Bereich" }

  - name: hofladen
    label: Hofladen
    files:
      - name: hofladen
        label: Hofladen – Aktuelles Angebot
        file: content/hofladen.json
        format: json
        fields:
          - label: "Stand (Datum)"
            name: stand
            widget: string
            default: ""
            hint: "z.B. Juni 2026 – erscheint auf der Website als 'Stand: ...' und zeigt an, wann das Angebot zuletzt aktualisiert wurde"
          - label: Kategorien
            name: categories
            widget: list
            fields:
              - { label: Kategoriename, name: name, widget: string, hint: "z.B. Gemüse, Salate, Obst / Nüsse / Säfte / Honig" }
              - label: "Produkte (eine pro Zeile)"
                name: items
                widget: text
                default: ""
                hint: "Jedes verfügbare Produkt in eine neue Zeile eingeben. Leere Kategorien werden nicht angezeigt."

  - name: aktuelles
    label: Aktuelles
    files:
      - name: aktuelles
        label: Aktuelles
        file: content/aktuelles.json
        format: json
        fields:
          - label: Beiträge
            name: items
            widget: list
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Datum, name: date,  widget: datetime, format: "YYYY-MM-DD" }
              - { label: Beitragsbild, name: image, widget: image, required: false, hint: "Empfohlen: 800×500 px, JPG oder WebP" }
              - { label: Text,  name: body,  widget: markdown }

  - name: downloads
    label: Downloads
    files:
      - name: downloads
        label: Downloads
        file: content/downloads.json
        format: json
        fields:
          - label: Downloads
            name: items
            widget: list
            fields:
              - { label: Titel,       name: title,    widget: string }
              - label: Kategorie
                name: category
                widget: select
                options:
                  - { label: "Agnihotra Aktuell (Jahrbuch)",   value: aktuell }
                  - { label: "Anleitung / Feuerpraxis",         value: anleitung }
                  - { label: "Flyer / Prospekt",                value: flyer }
                  - { label: "Pressebericht",                   value: presse }
                  - { label: "Wissenschaftliche Studie",        value: wissenschaft }
              - { label: Jahr,        name: year,     widget: string,   required: false, hint: "z.B. 2024" }
              - label: Sprache
                name: lang
                widget: select
                options:
                  - { label: Deutsch,     value: de }
                  - { label: English,     value: en }
                  - { label: Français,    value: fr }
                  - { label: Español,     value: es }
                  - { label: Italiano,    value: it }
                  - { label: Slovenščina, value: sl }
                  - { label: Română,      value: ro }
                  - { label: Bulgarski,   value: bg }
                  - { label: Čeština,     value: cs }
                  - { label: Русский,     value: ru }
                default: de
              - { label: Beschreibung, name: desc,   widget: text,    required: false }
              - label: PDF-Datei
                name: file
                widget: file
                media_folder: /downloads
                public_folder: /downloads
                hint: "PDF hochladen oder Pfad eingeben (z.B. downloads/anleitungen/agnihotra-anleitung-de.pdf)"
