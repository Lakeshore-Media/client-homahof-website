backend:
  name: git-gateway
  branch: main

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: veranstaltungen
    label: Veranstaltungen
    file: content/veranstaltungen.json
    format: json
    fields:
      - label: Veranstaltungen
        name: items
        widget: list
        fields:
          - { label: Titel,       name: title,    widget: string }
          - { label: Datum,       name: date,     widget: datetime, format: "YYYY-MM-DD" }
          - { label: Zeit,        name: time,     widget: string,   hint: "z.B. 09:00 – 17:00" }
          - { label: Ort,         name: location, widget: string,   default: "Homa-Hof Heiligenberg" }
          - { label: Beschreibung, name: desc,    widget: text }
          - { label: Beitrag,     name: price,    widget: string,   hint: "z.B. Kostenlos / Spende" }
          - { label: Kategorie,   name: category, widget: select,   options: [Seminar, Sommertreffen, Abend, Retreat, Workshop] }
          - { label: Badge-Farbe, name: badge,    widget: select,   options: [kostenlos, spende, kostenpflichtig], default: kostenlos }

  - name: hofladen
    label: Hofladen
    file: content/hofladen.json
    format: json
    fields:
      - label: Produkte
        name: items
        widget: list
        fields:
          - { label: Name,         name: name,  widget: string }
          - { label: Beschreibung, name: desc,  widget: text }
          - { label: Preis,        name: price, widget: string }
          - { label: Bild,         name: image, widget: image,  required: false }

  - name: aktuelles
    label: Aktuelles
    file: content/aktuelles.json
    format: json
    fields:
      - label: Beiträge
        name: items
        widget: list
        fields:
          - { label: Titel,  name: title, widget: string }
          - { label: Datum,  name: date,  widget: datetime, format: "YYYY-MM-DD" }
          - { label: Text,   name: body,  widget: markdown }
